name: Build Example

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Controleer of key beschikbaar is
        env:
          MIJN_SLEUTEL: ${{secrets.SECRET_KEY}}
        run: |
          if [ -n "$MIJN_SLEUTEL" ]; then
            echo "Het secret is beschikbaar."
          else
            echo "Het secret ontbreekt of is leeg."
            

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installeer dependencies
        run: npm install

      - name: Maak een zip van de applicatie
        run: zip -r app.zip . -x ".git/*" ".github/*"